<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Images</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script defer>
        function fetchUploadedImages() {
            fetch("fetch_uploaded_images.php")
                .then(response => response.json())
                .then(images => {
                    const gallery = document.getElementById("image-gallery");
                    gallery.innerHTML = "";

                    images.forEach(img => {
                        const container = document.createElement("div");
                        container.classList.add("image-container");

                        const imgElement = document.createElement("img");
                        imgElement.src = img.images;
                        imgElement.classList.add("uploaded-image");

                        const caption = document.createElement("p");
                        caption.textContent = `Volunteer: ${img.volunteer_name} - ${img.captions}`;

                        container.appendChild(imgElement);
                        container.appendChild(caption);
                        gallery.appendChild(container);
                    });
                })
                .catch(error => console.error("Error fetching images:", error));
        }

        document.addEventListener("DOMContentLoaded", fetchUploadedImages);
    </script>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        header {
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
        }
        section {
            background: rgba(40, 40, 40, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
            width: 80%;
            max-width: 1000px;
            text-align: center;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .image-container {
            background: #222;
            border-radius: 10px;
            padding: 10px;
            transition: transform 0.3s ease-in-out;
        }
        .image-container:hover {
            transform: scale(1.05);
        }
        .uploaded-image {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }
        p {
            font-size: 14px;
            margin-top: 10px;
            color: #bbb;
        }
        .back-button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #ff5722;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        .back-button:hover {
            background: #e64a19;
        }
    </style>
</head>
<body>
    <header>
        <h1>Admin Image Uploads</h1>
    </header>

    <section>
        <h2>Uploaded Disaster Images</h2>
        <div id="image-gallery" class="gallery"></div>
        <a href="admin_dashboard.html" class="back-button">Back to Dashboard</a>
    </section>
</body>
</html>
